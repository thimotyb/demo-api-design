# Dynamic configuration of Traefik: certificates, routers and services.
tls:
  certificates:
    - certFile: /certs/server.pem
      keyFile: /certs/server.key
  options:
    default:
      minVersion: VersionTLS12

http:
  routers:
    api:
      rule: Host(`api.m3.localhost`)
      entryPoints: [websecure]
      service: api
      tls: {}
    keycloak:
      rule: Host(`auth.m3.localhost`)
      entryPoints: [websecure]
      service: keycloak
      tls: {}
  services:
    # Traefik ends TLS and forwards plain HTTP to the containers on the private network.
    api:
      loadBalancer:
        servers:
          - url: http://api:8001
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080
