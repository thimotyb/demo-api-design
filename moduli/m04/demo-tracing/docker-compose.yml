# Jaeger for the M04 tracing demo: it receives the spans over OTLP and shows them in a web UI.
# Only Jaeger runs in Docker; the two APIs of M01 run on the host (see run.sh).
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      # Accept spans in the OpenTelemetry protocol (OTLP).
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # web UI
      - "4318:4318"     # OTLP over HTTP, where the APIs send their spans
